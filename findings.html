<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sargassum Forecasting — Findings</title>
<style>
:root {
  --bg: #f7f8fa; --card: #ffffff; --text: #1a1f26; --text2: #5b6472; --border: #e2e5ea;
  --accent: #1f3a93; --accent2: #6a1b9a; --green: #1e7b34; --amber: #b26a00; --red: #b71c1c;
  --tab-bg: #eef1f6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171c; --card: #1c2028; --text: #e8eaed; --text2: #9aa3b2; --border: #2d323b;
    --accent: #7c93e8; --accent2: #c58fe8; --green: #6fcf8a; --amber: #e0a94b; --red: #f08a8a;
    --tab-bg: #22262e;
  }
}
:root[data-theme="dark"] {
  --bg: #14171c; --card: #1c2028; --text: #e8eaed; --text2: #9aa3b2; --border: #2d323b;
  --accent: #7c93e8; --accent2: #c58fe8; --green: #6fcf8a; --amber: #e0a94b; --red: #f08a8a;
  --tab-bg: #22262e;
}
* { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: var(--bg); color: var(--text);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
.wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 48px; }
header { margin-bottom: 18px; }
h1 { font-size: 24px; margin: 0 0 4px; }
.sub { color: var(--text2); font-size: 14px; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 18px 0; border-bottom: 1px solid var(--border); }
.tab-btn { background: var(--tab-bg); color: var(--text2); border: 1px solid var(--border); border-bottom: none;
  padding: 9px 14px; border-radius: 8px 8px 0 0; cursor: pointer; font-size: 13.5px; }
.tab-btn.active { background: var(--card); color: var(--text); font-weight: 600; border-color: var(--accent); }
.panel { display: none; } .panel.active { display: block; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 18px; margin-bottom: 16px; }
h2 { font-size: 17px; margin: 0 0 10px; }
h3 { font-size: 14.5px; margin: 16px 0 8px; color: var(--text2); text-transform: uppercase; letter-spacing: .03em; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); }
th { color: var(--text2); font-weight: 600; }
.table-wrap { overflow-x: auto; }
.grid4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 10px; }
.metric { background: var(--tab-bg); border-radius: 8px; padding: 12px; text-align: center; }
.metric .v { font-size: 20px; font-weight: 700; color: var(--accent); }
.metric .l { font-size: 12px; color: var(--text2); margin-top: 2px; }
.banner { background: linear-gradient(0deg, transparent, transparent), var(--card); border: 1.5px solid var(--green);
  border-radius: 10px; padding: 16px 18px; margin-bottom: 16px; }
.banner .big { font-size: 22px; font-weight: 700; color: var(--green); }
.warn { background: rgba(178,106,0,.12); border: 1px solid var(--amber); color: var(--text); border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-top: 10px; }
.note { background: var(--tab-bg); border-radius: 8px; padding: 10px 12px; font-size: 13px; color: var(--text2); margin-top: 10px; }
select { background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 13.5px; }
ul { margin: 6px 0; padding-left: 20px; font-size: 13.5px; line-height: 1.6; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 640px) { .two-col { grid-template-columns: 1fr; } }
.img-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px,1fr)); gap: 14px; margin-top: 10px; }
.img-card { border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
.img-card img { width: 100%; height: auto; border-radius: 4px; }
.img-card .cap { font-size: 12.5px; color: var(--text2); margin-top: 6px; }
.chart-box { position: relative; height: 320px; }
pre { background: var(--tab-bg); border-radius: 8px; padding: 10px 12px; font-size: 12.5px; overflow-x: auto; }
.pill { display: inline-block; background: var(--tab-bg); border-radius: 12px; padding: 2px 9px; font-size: 12px; color: var(--text2); margin-left: 6px; }
svg text { fill: var(--text); font-size: 10.5px; }
.best-row { background: rgba(30,123,52,.10); }
</style>
</head>
<div class="wrap">
<header>
  <h1>Sargassum distribution forecasting</h1>
  <div class="sub">Harshit Bazari, Adit Bagaitkar &#8226; Guide: Dr. Jayshree Aher &#8226; School of CSE (BTech CSE AI &amp; DS)</div>
</header>
<div class="tabs" id="tabs"></div>
<div id="panels"></div>
</div>

  const metric = document.getElementById("metricSel").value;

    if(modelChart) modelChart.destroy();
    modelChart = new Chart(document.getElementById("modelChart"), {
      type:"bar",
      data:{ labels: RESULTS.map(r=>r.model), datasets:[{ label:metric, data: RESULTS.map(r=>r[key]),

}
